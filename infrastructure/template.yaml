AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SanitiSense AI — Backend Infrastructure (SAM Template)

# ============================================
# HOW TO DEPLOY:
#   sam build
#   sam deploy --guided
# ============================================

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        TABLE_NAME: SanitiSense
        S3_BUCKET: sanitisense-media-982253889131
        BEDROCK_MODEL_ID: us.anthropic.claude-sonnet-4-20250514-v1:0
        KNOWLEDGE_BASE_ID: YOUR_KB_ID  # TODO: replace after creating KB

Resources:

  # ========== API GATEWAY ==========
  SanitiSenseApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ========== LAMBDA FUNCTIONS ==========
  ReportProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/
      Handler: report_processor.handler
      Events:
        PostReport:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /reports
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: SanitiSense
        - S3CrudPolicy:
            BucketName: sanitisense-media-982253889131

  ImageAnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/
      Handler: image_analyzer.handler
      Timeout: 60
      MemorySize: 512
      Events:
        AnalyzeImage:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /analyze
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: SanitiSense
        - S3ReadPolicy:
            BucketName: sanitisense-media-982253889131
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - rekognition:DetectLabels
              Resource: '*'

  TaskManagerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/
      Handler: task_manager.handler
      Events:
        CreateTask:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /tasks
            Method: post
        GetTasks:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /tasks
            Method: get
        UpdateTask:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /tasks/{task_id}
            Method: put
        GetWorkerTasks:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /worker/{worker_id}/tasks
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: SanitiSense

  ValidationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/
      Handler: validation.handler
      Timeout: 60
      MemorySize: 512
      Events:
        Validate:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /validate
            Method: post
      Policies:
        - DynamoDBCrudPolicy:
            TableName: SanitiSense
        - S3ReadPolicy:
            BucketName: sanitisense-media-982253889131
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: '*'

  EpidemicAdvisorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/
      Handler: epidemic_advisor.handler
      Timeout: 60
      Events:
        GetEpidemicRisk:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /epidemic
            Method: get
        GetCityOverview:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /epidemic/city-overview
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: SanitiSense
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:RetrieveAndGenerate
                - bedrock:Retrieve
              Resource: '*'

  DashboardApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/lambdas/
      Handler: dashboard_api.handler
      Events:
        FullDashboard:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /dashboard
            Method: get
        DashboardStats:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /dashboard/stats
            Method: get
        DashboardHeatmap:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /dashboard/heatmap
            Method: get
        DashboardTrends:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /dashboard/trends
            Method: get
        DashboardLeaderboard:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /dashboard/leaderboard
            Method: get
        DashboardRecent:
          Type: Api
          Properties:
            RestApiId: !Ref SanitiSenseApi
            Path: /dashboard/recent
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: SanitiSense

# NOTE: DynamoDB table and S3 buckets were created manually:
#   - DynamoDB: SanitiSense (PK/SK + GSI1)
#   - S3: sanitisense-media-982253889131
#   - S3: sanitisense-knowledge-982253889131

# ========== OUTPUTS ==========
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${SanitiSenseApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
